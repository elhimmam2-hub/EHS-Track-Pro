name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          find . -name gradlew -exec chmod +x {} \;

      - name: Build APK with Gradle
        run: |
          GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \;)
          if [ -n "$GRADLE_DIR" ]; then
            cd "$GRADLE_DIR" && ./gradlew assembleRelease --no-daemon
          else
            echo "Gradlew not found" && exit 1
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: '**/build/outputs/apk/release/*.apk'
